name: Buat APK FRYCO REMOTE
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Cari folder project
        run: |
          ls -la
          # cari dimana settings.gradle berada
          DIR=$(find . -name "settings.gradle*" | head -1 | xargs dirname)
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
          echo "Project ada di $DIR"
          ls -la $DIR

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Jalankan gradlew dan Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: FRYCO-REMOTE-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
